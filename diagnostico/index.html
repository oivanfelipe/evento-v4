<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<title>Mapa de Gargalos e Oportunidades: V4 Carvalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a; --card: #111; --card2: #1a1a1a; --accent: #E10600; --accent-l: #ff4a42;
  --glow: rgba(225, 6, 0, .16); --text: #f5f4f0; --text2: #a8a8a8; --muted: #666; --border: #2a2a2a;
  --ok: #7b9a7b; --warn: #D4AF37;
  --serif: "Playfair Display", Georgia, serif; --sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --pad: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
body { background-image: radial-gradient(circle at 50% -10%, var(--glow), transparent 55%); }
button, input, textarea { font: inherit; touch-action: manipulation; }

/* Estrutura: cabeçalho fixo, conversa que rola, caixa de resposta fixa embaixo.
   A altura acompanha o teclado (var --vvh, definida em app.js via visualViewport). */
#app { display: flex; flex-direction: column; height: var(--vvh, 100dvh); max-width: 680px; margin: 0 auto; }
header { flex: none; padding: 10px var(--pad); padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 600; letter-spacing: .04em; font-size: .8rem; white-space: nowrap; } .brand b { color: var(--accent); }
.prog { flex: 1; height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s; }
#passo { font-size: .75rem; color: var(--text2); min-width: 34px; text-align: right; }
main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px var(--pad) 8px; overscroll-behavior: contain; scroll-behavior: auto; }
#dock { flex: none; padding: 10px var(--pad) max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--bg); }
#dock:empty { display: none; }

/* Conversa */
.bolha { max-width: 88%; padding: 12px 14px; border-radius: 16px; margin: 0 0 10px; line-height: 1.45; font-size: 1rem; animation: sobe .25s ease; white-space: pre-wrap; overflow-wrap: anywhere; }
.bot { background: var(--card2); border: 1px solid var(--border); border-top-left-radius: 4px; }
.eu { background: var(--accent); margin-left: auto; border-top-right-radius: 4px; }
.eu.pulou { background: transparent; border: 1px dashed var(--border); color: var(--text2); }
.etapa { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-l); margin: 18px 0 8px; }
@keyframes sobe { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.digitando { display: inline-flex; gap: 5px; align-items: center; padding: 14px 16px; }
.digitando span { width: 7px; height: 7px; border-radius: 50%; background: var(--text2); animation: pisca 1.1s infinite; }
.digitando span:nth-child(2) { animation-delay: .16s; } .digitando span:nth-child(3) { animation-delay: .32s; }
@keyframes pisca { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

/* Respostas por toque: botões altos (>= 52px), em grade quando o texto é curto */
.titulo-dock { font-size: .8rem; color: var(--text2); margin: 0 0 8px; }
.opcoes { display: grid; gap: 8px; max-height: 46dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.opcoes.grade { grid-template-columns: 1fr 1fr; } .opcoes.lista { grid-template-columns: 1fr; }
.op { min-height: 52px; padding: 10px 12px; font-size: 1rem; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 14px; cursor: pointer; text-align: center; line-height: 1.25; }
.opcoes.lista .op { text-align: left; }
.op:active { background: var(--accent); border-color: var(--accent); }
.op.on { background: var(--accent); border-color: var(--accent); }
.op[data-pos]:not([data-pos=""])::before { content: attr(data-pos); display: inline-block; min-width: 1.4em; margin-right: 8px; font-weight: 700; }
.btn { min-height: 52px; padding: 0 18px; font-size: 1rem; font-weight: 600; color: var(--text); background: var(--accent); border: 1px solid var(--accent); border-radius: 14px; cursor: pointer; width: 100%; }
.btn:disabled { opacity: .4; }
.btn.sec { background: transparent; border-color: var(--border); color: var(--text2); font-weight: 500; min-height: 44px; }
.rodape { display: flex; gap: 8px; margin-top: 8px; } .rodape .btn.sec { flex: 1; }

/* Campos de texto: 16px evita o zoom automático do iOS */
.linha { display: flex; gap: 8px; align-items: flex-end; }
input[type=text], input[type=tel], textarea { flex: 1; min-width: 0; font-size: 16px; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; min-height: 52px; resize: none; }
textarea { line-height: 1.4; max-height: 32dvh; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
.redondo { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--text); display: grid; place-items: center; cursor: pointer; }
.redondo.env { background: var(--accent); border-color: var(--accent); }
.redondo:disabled { opacity: .4; }
.redondo svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dica { font-size: .8rem; color: var(--text2); margin: 0 0 8px; line-height: 1.35; }
.erro { color: var(--accent-l); font-size: .85rem; margin: 0 0 8px; }

/* Gravação de áudio */
.gravando { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--accent); border-radius: 14px; background: var(--glow); min-height: 60px; }
.ponto { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); animation: grava 1s infinite; flex: none; }
@keyframes grava { 50% { transform: scale(1.5); opacity: .5; } }
.gravando .tempo { font-variant-numeric: tabular-nums; font-weight: 600; }
.gravando .txt { flex: 1; font-size: .85rem; color: var(--text2); }
.redondo.para { background: var(--accent); border-color: var(--accent); }
.transc { display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: .9rem; min-height: 52px; }
.giro { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

.capa { text-align: center; padding: 7dvh 0 0; }
.capa h1 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(2rem, 9vw, 3rem); line-height: 1.1; margin: 0 0 14px; }
.capa p { color: var(--text2); max-width: 460px; margin: 0 auto 24px; line-height: 1.5; }

/* Mapa */
.mapa h2 { font-family: var(--serif); font-weight: 400; font-size: 1.8rem; line-height: 1.15; margin: 6px 0 10px; }
.mapa .resumo { color: var(--text2); line-height: 1.55; margin: 0 0 16px; }
.est { border: 1px solid var(--accent); background: var(--glow); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
.est b { font-size: 1.35rem; color: var(--accent-l); } .est small { display: block; color: var(--text2); margin-top: 4px; }
.cartao { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.cartao h3 { font-family: var(--serif); font-weight: 400; font-size: 1.4rem; margin: 0 0 4px; }
.tag { display: inline-block; font-size: .72rem; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--border); color: var(--text2); margin: 0 6px 6px 0; }
.tag.p { border-color: var(--accent); color: var(--accent-l); }
.passo { margin: 12px 0 0; } .passo h4 { margin: 0 0 3px; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-l); font-weight: 600; }
.passo p, .passo li { margin: 0; line-height: 1.5; color: #ddd; font-size: .95rem; } .passo ul { margin: 0; padding-left: 18px; }
.caso { margin-top: 10px; padding: 12px; background: var(--card2); border-radius: 10px; border-left: 3px solid var(--accent); }
.caso strong { display: block; margin-bottom: 4px; } .caso p { margin: 0 0 6px; font-size: .88rem; color: #cfcfcf; line-height: 1.45; }
.caso a { color: var(--accent-l); font-size: .85rem; word-break: break-all; }
a { color: var(--accent-l); }
.nota { color: var(--muted); font-size: .78rem; line-height: 1.5; margin: 14px 0; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 28px; }
@media (prefers-reduced-motion: reduce) { .bolha, .ponto, .giro { animation: none; } .digitando span { animation: none; opacity: .7; } }
.so-impressao { display: none; }
.status-salvo { font-size: .8rem; color: var(--text2); margin: 0 0 10px; } .status-salvo.ok { color: var(--ok); } .status-salvo.pend { color: var(--warn); }
@media print {
  @page { margin: 14mm 12mm; }
  html, body { background: #fff !important; color: #111; height: auto !important; overflow: visible !important; }
  #app { display: block; height: auto !important; max-width: none; }
  header, #dock, .acoes, .status-salvo { display: none !important; }
  main { display: block; overflow: visible !important; padding: 0; }
  /* só o Mapa: toda a conversa (balões, etapas, indicador) fica fora do PDF */
  #chat > :not(.mapa) { display: none !important; }
  .so-impressao { display: flex !important; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 2px solid #E10600; padding-bottom: 8px; margin-bottom: 14px; font-size: 10pt; color: #444; }
  .so-impressao b { color: #E10600; letter-spacing: .06em; font-size: 11pt; }
  .mapa h2 { font-size: 20pt; margin-top: 0; color: #111; }
  .mapa .resumo, .nota { color: #444; }
  .cartao, .caso, .est { background: #fff !important; border-color: #bbb; box-shadow: none; }
  .cartao { break-inside: auto; }
  .cartao h3, .passo h4 { break-after: avoid; }
  .caso, .passo p, .passo li { break-inside: avoid; }
  .passo p, .passo li, .caso p { color: #222; }
  .tag, .tag.p { color: #333; border-color: #999; }
  .caso a { color: #1a4fb3; text-decoration: none; }
  .caso a::after { content: attr(href); display: block; font-size: 7.5pt; color: #555; word-break: break-all; }
  .est b { color: #b30500; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">V4 <b>·</b> MAPA</div>
    <div class="prog" aria-hidden="true"><i id="barra"></i></div>
    <div id="passo" aria-live="off"></div>
  </header>
  <main id="chat" aria-live="polite"></main>
  <div id="dock"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
